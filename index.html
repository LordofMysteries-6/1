<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>3D几何体hover效果</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 10%, #2a2a2a 0%, transparent 26%),
    radial-gradient(circle at 80% 20%, #333 0%, transparent 28%),
    linear-gradient(180deg, #111 0%, #1c1c1c 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 50px;
  padding: 60px 0;
}

.shape {
  width: 120px;
  height: 120px;
  position: relative;
  transition: all 0.3s ease;
  cursor: pointer;
}

/* 共用底座阴影 */
.shape::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -30px;
  width: 110px;
  height: 18px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 70%);
  transition: all 0.3s ease;
}

/* hover文字 */
.shape::after {
  content: "hover";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 10;
}

/* ========== 1. 橙色立方体 ========== */
.cube1 {
  background:
    linear-gradient(135deg,
      #ffb59a 0%,
      #ff7a52 45%,
      #c94a1d 100%);
  border-radius: 4px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    inset 0 -18px 0 rgba(0, 0, 0, 0.25),
    inset 18px 0 0 rgba(0, 0, 0, 0.12),
    inset -18px 0 0 rgba(255, 255, 255, 0.12),
    0 18px 0 rgba(0, 0, 0, 0.35),
    0 22px 25px rgba(0, 0, 0, 0.35);
}

/* ========== 2. 绿色小圆角立方体 ========== */
.cube2 {
  background:
    linear-gradient(135deg,
      #7bf0b4 0%,
      #2fd289 45%,
      #0f8f5c 100%);
  border-radius: 14px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.4),
    inset 0 -18px 0 rgba(0, 0, 0, 0.25),
    inset 18px 0 0 rgba(0, 0, 0, 0.12),
    inset -18px 0 0 rgba(255, 255, 255, 0.12),
    0 18px 0 rgba(0, 0, 0, 0.35),
    0 22px 25px rgba(0, 0, 0, 0.35);
}

/* ========== 3. 紫色大圆角立方体 ========== */
.cube-round1 {
  background:
    linear-gradient(135deg,
      #d7c7eb 0%,
      #a594c7 45%,
      #6b5894 100%);
  border-radius: 30px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    inset 0 -18px 0 rgba(0, 0, 0, 0.25),
    inset 18px 0 0 rgba(0, 0, 0, 0.12),
    inset -18px 0 0 rgba(255, 255, 255, 0.12),
    0 18px 0 rgba(0, 0, 0, 0.35),
    0 22px 25px rgba(0, 0, 0, 0.35);
}

/* ========== 4. 橙色球体 ========== */
.sphere1 {
  background:
    radial-gradient(circle at 30% 25%,
      #fff1cf 0%,
      #ffd28a 25%,
      #ffa547 55%,
      #d97b14 100%);
  border-radius: 50%;
  box-shadow:
    inset -10px -12px 20px rgba(0, 0, 0, 0.35),
    inset 10px 10px 18px rgba(255, 255, 255, 0.25),
    0 18px 0 rgba(0, 0, 0, 0.35),
    0 22px 25px rgba(0, 0, 0, 0.35);
}

/* ========== 5. 青绿色圆角立方体 ========== */
.cube-round2 {
  background:
    linear-gradient(135deg,
      #b0e2db 0%,
      #58ada3 45%,
      #24665e 100%);
  border-radius: 24px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    inset 0 -18px 0 rgba(0, 0, 0, 0.25),
    inset 18px 0 0 rgba(0, 0, 0, 0.12),
    inset -18px 0 0 rgba(255, 255, 255, 0.12),
    0 18px 0 rgba(0, 0, 0, 0.35),
    0 22px 25px rgba(0, 0, 0, 0.35);
}

/* ========== 6. 紫色球体 ========== */
.sphere2 {
  background:
    radial-gradient(circle at 30% 25%,
      #f1d9ff 0%,
      #c9a3e8 25%,
      #9571c7 55%,
      #5d428c 100%);
  border-radius: 50%;
  box-shadow:
    inset -10px -12px 20px rgba(0, 0, 0, 0.35),
    inset 10px 10px 18px rgba(255, 255, 255, 0.25),
    0 18px 0 rgba(0, 0, 0, 0.35),
    0 22px 25px rgba(0, 0, 0, 0.35);
}

/* ========== hover效果 ========== */
.shape:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 0;
}

.shape:hover::before {
  opacity: 0;
  transform: translateX(-50%) scale(0.7);
}

.shape:hover::after {
  opacity: 1;
}
</style>
</head>
<body>

  <div class="shape cube1"></div>
  <div class="shape cube2"></div>
  <div class="shape cube-round1"></div>
  <div class="shape sphere1"></div>
  <div class="shape cube-round2"></div>
  <div class="shape sphere2"></div>

</body>
</html>
